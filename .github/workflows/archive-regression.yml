name: archival-analysis-regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reproduce.py --outdir results/ci-reproduced
      - run: python analysis/final50k/test_analyse_final50k.py
      - run: python analysis/final50k/test_exact_ties.py
